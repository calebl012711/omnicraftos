<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="oc_base_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="oc_tile_1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="oc_tile_2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>
    <linearGradient id="oc_tile_3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="oc_tile_4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F472B6" />
      <stop offset="100%" stop-color="#DB2777" />
    </linearGradient>
    <filter id="oc_glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Squircle Base Frame (Microsoft 365 / Apple HIG Pro Squircle) -->
  <rect x="4" y="4" width="56" height="56" rx="16" fill="url(#oc_base_grad)" stroke="rgba(255,255,255,0.14)" stroke-width="1.2" />

  <!-- 4 Fluent Modern Layered Studio Tiles -->
  <!-- Top Left: Visual / Broadcast & Design (Cyan Fluent Arc) -->
  <rect x="13" y="13" width="17" height="17" rx="6" fill="url(#oc_tile_1)" filter="url(#oc_glow)" />
  <path d="M18 21.5L24 18L24 25L18 21.5Z" fill="#FFFFFF" fill-opacity="0.95" />

  <!-- Top Right: Engineering CAD / Geometry (Indigo Fluent Tile) -->
  <rect x="34" y="13" width="17" height="17" rx="6" fill="url(#oc_tile_2)" filter="url(#oc_glow)" />
  <path d="M42.5 17L48 20.2V26.8L42.5 30L37 26.8V20.2L42.5 17Z" stroke="#FFFFFF" stroke-width="1.4" stroke-linejoin="round" fill="none" opacity="0.95"/>
  <path d="M42.5 23.5L48 20.2M42.5 23.5V30M42.5 23.5L37 20.2" stroke="#FFFFFF" stroke-width="1.4" stroke-linejoin="round" opacity="0.95"/>

  <!-- Bottom Left: Audio / Sound Synthesis (Emerald Fluent Tile) -->
  <rect x="13" y="34" width="17" height="17" rx="6" fill="url(#oc_tile_3)" filter="url(#oc_glow)" />
  <rect x="17" y="41" width="2" height="5" rx="1" fill="#FFFFFF" opacity="0.95" />
  <rect x="20.5" y="38" width="2" height="11" rx="1" fill="#FFFFFF" opacity="0.95" />
  <rect x="24" y="40" width="2" height="7" rx="1" fill="#FFFFFF" opacity="0.95" />

  <!-- Bottom Right: Video / Document Suite (Rose / Fuchsia Fluent Tile) -->
  <rect x="34" y="34" width="17" height="17" rx="6" fill="url(#oc_tile_4)" filter="url(#oc_glow)" />
  <circle cx="42.5" cy="42.5" r="4.5" stroke="#FFFFFF" stroke-width="1.4" fill="none" opacity="0.95"/>
  <circle cx="42.5" cy="42.5" r="1.5" fill="#FFFFFF" opacity="0.95"/>
</svg>
