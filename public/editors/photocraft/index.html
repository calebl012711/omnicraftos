<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="application-name" content="OmniCraft OS">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>OmniCraft OS — Layered Image Editor (PhotoCraft Engine)</title>
  
<script type="module">
import init, * as bindings from './photocraft-web-boot-d30f1074f00f1323.js';
const wasm = await init({ module_or_path: './photocraft-web-boot-d30f1074f00f1323_bg.wasm' });


window.wasmBindings = bindings;


dispatchEvent(new CustomEvent("TrunkApplicationStarted", {detail: {wasm}}));

</script>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #262626; }
    #photocraft_canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; box-sizing: border-box; outline: 1px solid rgba(255, 255, 255, 0.08); outline-offset: -1px; }
    #photocraft_loading { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 12px; padding: 0 16px; text-align: center; color: #b8b8b8; font: 14px system-ui, sans-serif; pointer-events: none; }
    .omnicraft-bento-badge {
      display: inline-flex; align-items: center; gap: 8px; padding: 8px 16px;
      background: rgba(18, 20, 24, 0.88); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 8px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.35); color: #e5e7eb;
      font: 500 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;
      letter-spacing: 0.01em; user-select: none;
    }
    .omnicraft-pulse-dot {
      width: 7px; height: 7px; border-radius: 50%; background: #c87d55;
      box-shadow: 0 0 8px #c87d55; animation: omnicraft-pulse 1.8s ease-in-out infinite; flex-shrink: 0;
    }
    .omnicraft-brand { font-weight: 600; color: #fff; letter-spacing: 0.02em; }
    .omnicraft-sep { opacity: 0.35; font-weight: 300; }
    @keyframes omnicraft-pulse { 0%, 100% { transform: scale(0.9); opacity: 0.6; } 50% { transform: scale(1.15); opacity: 1; } }
    #photocraft_loading p { margin: 0; max-width: 420px; line-height: 1.5; }
    #photocraft_loading a { color: #e0e0e0; pointer-events: auto; }
    /* The app removes this element once it runs. If the WebAssembly never downloads or doesn't match
       this page, no Rust runs to say so, so the page itself shows what to do after a while. */
    #photocraft_stalled { color: #8c8c8c; visibility: hidden; animation: photocraft-stalled 0s 20s forwards; }
    @keyframes photocraft-stalled { to { visibility: visible; } }
  </style>
<link rel="modulepreload" href="./photocraft-web-boot-d30f1074f00f1323.js" crossorigin="anonymous" integrity="sha384-0mr8sUSrsQQjFxFgIcO6DS7jiTtsn5P4yAA68UfbnKInm7cl8Ls6ySLXKfxguSTJ"><link rel="modulepreload" href="./snippets/eframe-d31a8450ea12dfc1/inline0.js" crossorigin="anonymous" integrity="sha384-uPZQ72BwgZ4v7Km6+UIFbkDDlt7ShGEsAVEHVN/+wZSGFhItJZB83iKMFQXauTSs"><link rel="preload" href="./photocraft-web-boot-d30f1074f00f1323_bg.wasm" crossorigin="anonymous" integrity="sha384-kijC8EBhbGYMNdXMEACv9e2ys3zqmvNIMXZB56htvl/QeZikdgXXfoGMoX7EgPaR" as="fetch" type="application/wasm"></head>
<body>
  <canvas id="photocraft_canvas"></canvas>
  <div id="photocraft_loading">
    <div class="omnicraft-bento-badge">
      <span class="omnicraft-pulse-dot"></span>
      <span class="omnicraft-brand">OmniCraft OS</span>
      <span class="omnicraft-sep">/</span>
      <span>PhotoCraft Layer Lab</span>
    </div>
    <p id="photocraft_stalled">This is taking longer than usual. If PhotoCraft doesn't start, its files may have failed to
      download or come from a different version of this page. <a href="">Reload</a> to try again; the browser
      console lists what failed.</p>
  </div>
  <script src="../bento-theme-bridge.js?app=photocraft"></script>
  <script src="../mosaic-forge-bridge.js?app=photocraft"></script>
</body>
</html>
