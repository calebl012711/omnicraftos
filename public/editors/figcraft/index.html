  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; overscroll-behavior: none; background: #f5f5f5; }
    #figcraft_canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; box-sizing: border-box; outline: 1px solid rgba(255, 255, 255, 0.08); outline-offset: -1px; }
    #figcraft_loading { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      color: #6b6b6b; font: 14px system-ui, sans-serif; pointer-events: none; }
    .omnicraft-bento-badge {
      display: inline-flex; align-items: center; gap: 8px; padding: 8px 16px;
      background: rgba(18, 20, 24, 0.88); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 8px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.35); color: #e5e7eb;
      font: 500 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;
      letter-spacing: 0.01em; user-select: none;
    }
    .omnicraft-pulse-dot {
      width: 7px; height: 7px; border-radius: 50%; background: #c87d55;
      box-shadow: 0 0 8px #c87d55; animation: omnicraft-pulse 1.8s ease-in-out infinite; flex-shrink: 0;
    }
    .omnicraft-brand { font-weight: 600; color: #fff; letter-spacing: 0.02em; }
    .omnicraft-sep { opacity: 0.35; font-weight: 300; }
    @keyframes omnicraft-pulse { 0%, 100% { transform: scale(0.9); opacity: 0.6; } 50% { transform: scale(1.15); opacity: 1; } }
    /* Shown once the page stopped on an internal error (web.rs: show_stopped). */
    #figcraft_stopped { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; box-sizing: border-box;
      padding: 16px; text-align: center; color: #1e1e1e; background: rgba(245, 245, 245, 0.92); font: 14px/1.5 system-ui, sans-serif; }
    @media (prefers-color-scheme: dark) {
      html, body { background: #2c2c2c; }
      #figcraft_loading { color: #b8b8b8; }
      #figcraft_stopped { color: #f0f0f0; background: rgba(44, 44, 44, 0.92); }
    }
  </style>
