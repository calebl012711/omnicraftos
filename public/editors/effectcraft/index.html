<!doctype html>
<html lang="en">
<head>
  <meta name="application-name" content="OmniCraft OS">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#1b1c1f">
  <meta name="description" content="EffectCraft: motion graphics and visual effects in the browser">
  <title>OmniCraft OS — Motion Graphics & VFX (EffectCraft Engine)</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-256.png">
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #1b1c1f; }
    canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; outline: none; box-sizing: border-box; outline: 1px solid rgba(255, 255, 255, 0.08); outline-offset: -1px; }
    #loading {
      position: absolute; inset: 0; display: flex; flex-direction: column; gap: 14px;
      align-items: center; justify-content: center; color: #c9c9cc;
      font: 14px/1.4 system-ui, sans-serif; pointer-events: none;
    }
    #loading img { width: 48px; height: 48px; }
    .omnicraft-bento-badge {
      display: inline-flex; align-items: center; gap: 8px; padding: 8px 16px;
      background: rgba(18, 20, 24, 0.88); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 8px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.35); color: #e5e7eb;
      font: 500 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;
      letter-spacing: 0.01em; user-select: none;
    }
    .omnicraft-pulse-dot {
      width: 7px; height: 7px; border-radius: 50%; background: #c87d55;
      box-shadow: 0 0 8px #c87d55; animation: omnicraft-pulse 1.8s ease-in-out infinite; flex-shrink: 0;
    }
    .omnicraft-brand { font-weight: 600; color: #fff; letter-spacing: 0.02em; }
    .omnicraft-sep { opacity: 0.35; font-weight: 300; }
    @keyframes omnicraft-pulse { 0%, 100% { transform: scale(0.9); opacity: 0.6; } 50% { transform: scale(1.15); opacity: 1; } }
    #loading .err { color: #ff8a7a; white-space: pre-wrap; max-width: 70ch; pointer-events: auto; }
    #device-lost {
      position: absolute; inset: 0; display: flex; flex-direction: column; gap: 10px;
      align-items: center; justify-content: center; padding: 16px; text-align: center;
      background: rgb(18 18 18 / 0.85); color: #c8c8c8; font: 14px/1.4 system-ui, sans-serif;
    }
    #device-lost strong { color: #e3e3e3; font-size: 16px; }
    #device-lost p { margin: 0; max-width: 60ch; }
    #device-lost small { color: #8c8c8c; font-size: 12px; }
    #device-lost div { display: flex; gap: 8px; }
    #device-lost button {
      padding: 6px 14px; border: 1px solid #3a3a3a; border-radius: 4px;
      background: #232323; color: #e3e3e3; font: inherit; cursor: pointer;
    }
    #device-lost button:hover { background: #303030; }
    #device-lost button:last-child { background: #2d8ceb; border-color: #2d8ceb; }
    #device-lost button:last-child:hover { background: #4aa0f5; }
    #device-lost button:disabled { opacity: 0.6; cursor: default; }
  </style>
</head>
<body>
  <canvas id="effectcraft_canvas"></canvas>
  <div id="loading">
    <img src="favicon.svg" alt="">
    <div class="omnicraft-bento-badge">
      <span class="omnicraft-pulse-dot"></span>
      <span class="omnicraft-brand">OmniCraft OS</span>
      <span class="omnicraft-sep">/</span>
      <span id="status">EffectCraft Motion Graphics & VFX</span>
    </div>
  </div>
  <script type="module">
    import init, * as ec from "./effectcraft_web.js";
    const t0 = performance.now();
    window.effectcraftLoad = {};
    // The agent / test API: the desktop control channel as promises (docs/web.md).
    window.effectcraft = {
      request: (method, params) => ec.request(method, params ?? {}),
      execute: (command, params) => ec.request("engine.execute", { command, params: params ?? {} }),
      commands: () => ec.request("engine.commands", {}),
      inspect: () => ec.request("ui.inspect", {}),
      screenshot: (params) => ec.request("ui.screenshot", params ?? {}),
      renderFrame: (params) => ec.request("render.frame", { base64: true, ...(params ?? {}) }),
      files: () => ec.files(),
      readFile: (path) => ec.readFile(path),
      addFile: async (fileOrUrl, name) => {
        let bytes;
        if (typeof fileOrUrl === "string") {
          bytes = new Uint8Array(await (await fetch(fileOrUrl)).arrayBuffer());
          name = name ?? fileOrUrl.split("/").pop();
        } else {
          bytes = new Uint8Array(await fileOrUrl.arrayBuffer());
          name = name ?? fileOrUrl.name;
        }
        return ec.addFile(name, bytes);
      },
      info: () => ({
        ...ec.info(),
        crossOriginIsolated: self.crossOriginIsolated,
        webgpu: !!navigator.gpu,
        serviceWorker: (() => {
          try {
            return !!(navigator.serviceWorker && navigator.serviceWorker.controller);
          } catch {
            return false;
          }
        })(),
        load: window.effectcraftLoad,
      }),
      // Browser storage (OPFS / IndexedDB): save without downloading, list, remove, wait for writes.
      saveToBrowser: (path) => ec.saveToBrowser(path ?? undefined),
      listStored: () => ec.listStored(),
      removeStored: (path) => ec.removeStored(path),
      flush: () => ec.flush(),
      // A frame rendered in a frame worker (its GPU by default) vs the page's CPU: {maxDiff, meanDiff, over4, …}.
      workerFrameCheck: (params) => ec.workerFrameCheck(params ?? {}).then(JSON.parse),
    };
    // Offline start and install (PWA): the service worker caches the app's files.
    if (!new URLSearchParams(location.search).has("nosw")) {
      try {
        if ("serviceWorker" in navigator && navigator.serviceWorker) {
          navigator.serviceWorker.register("sw.js").catch((e) => console.warn("service worker:", e));
        }
      } catch (e) {
        console.warn("service worker:", e);
      }
    }
    try {
      // Compile once: the page and its render workers instantiate the same module.
      const wasmUrl = new URL("effectcraft_web_bg.wasm", location.href);
      let module;
      try {
        module = await WebAssembly.compileStreaming(fetch(wasmUrl));
      } catch {
        module = await WebAssembly.compile(await (await fetch(wasmUrl)).arrayBuffer());
      }
      window.effectcraftModule = module;
      await init({ module_or_path: module });
      window.effectcraftLoad.wasmMs = performance.now() - t0;
      await ec.start("effectcraft_canvas");
      window.effectcraftLoad.readyMs = performance.now() - t0;
    } catch (e) {
      const s = document.getElementById("status");
      if (s) { s.className = "err"; s.textContent = "EffectCraft failed to start:\n" + (e && e.stack || e); }
      window.effectcraftLoad.error = String(e);
      throw e;
    }
  </script>
  <script src="../bento-theme-bridge.js?app=effectcraft"></script>
  <script src="../mosaic-forge-bridge.js?app=effectcraft"></script>
</body>
</html>
